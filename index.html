    <title>React Firebase Auth - Cadastro, Login e Principal</title>
    <script>
      // Truque para o BrowserRouter funcionar no GitHub Pages:
      // o 404.html salva a rota original no sessionStorage e redireciona
      // para a raiz; este script restaura a URL antes do app carregar.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
